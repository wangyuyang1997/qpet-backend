name: Deploy Backend

on:
  push:
    branches: [master]

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新代码
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/qpet
            for i in 1 2 3; do
              git pull origin master && break || sleep 5
            done

  build:
    needs: pull
    runs-on: ubuntu-latest
    steps:
      - name: 构建 Docker 镜像
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/qpet
            docker compose build backend

  restart:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 重启服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/qpet
            docker compose up -d backend

  logs:
    needs: restart
    runs-on: ubuntu-latest
    steps:
      - name: 查看启动日志
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/qpet
            docker compose logs --tail=5 backend
