# Q宠乐斗 v5.0 全量编排
# 部署路径: /opt/qpet/docker-compose.yml
# PG/Redis/MQ 使用独立编排（root_default 网络），不在此 compose 内

services:
  backend:
    build:
      context: /root/qpet-backend/backend
      dockerfile: Dockerfile
    image: qpet-backend:latest
    container_name: qpet-backend
    env_file:
      - .env
    volumes:
      - ./data/logs:/app/logs
    networks:
      - root_default
    restart: unless-stopped

  frontend:
    build:
      context: /root/qpet-frontend
      dockerfile: Dockerfile
    image: qpet-frontend:latest
    container_name: qpet-frontend
    ports:
      - 5174:80
    networks:
      - root_default
    depends_on:
      - backend
    restart: unless-stopped

networks:
  root_default:
    external: true
